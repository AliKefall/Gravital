
services:
  nginx:
    image: nginx:alpine
    container_name: gravital-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - gravital-network

  backend:
    build: .
    container_name: gravital-backend
    env_file:
      - .env
    environment:
      PORT: 8080
    volumes:
      - ./uploads:/var/www/gravital-uploads
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - gravital-network

  frontend:
    build: ./frontend
    container_name: gravital-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - gravital-network

  prometheus:
    image: prom/prometheus:latest
    container_name: gravital-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - gravital-network

  grafana:
    image: grafana/grafana:latest
    container_name: gravital-grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - gravital-network

  certbot:
    image: certbot/certbot
    container_name: gravital-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - gravital-network

volumes:
  uploads:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  gravital-network:
    driver: bridge

