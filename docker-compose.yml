version: "3.9"

services:
  backend:
    build: .
    container_name: gravital-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - uploads:/var/www/gravital-uploads
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: gravital-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gravital-grafana
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  uploads:
  prometheus_data:
  grafana_data:
