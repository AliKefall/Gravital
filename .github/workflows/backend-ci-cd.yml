
name: Backend CI/CD

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'server/**'
      - 'internal/**'
      - 'sql/**'
      - '.github/workflows/backend-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'server/**'
      - 'internal/**'
      - 'sql/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.24.x'

jobs:
  ci:
    name: CI (test + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -path ./frontend -prune -o -name '*.go' -print))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run backend tests
        run: |
          PKGS=$(go list ./... | grep -v '/frontend/node_modules/' || true)
          if [ -z "$PKGS" ]; then
            echo "No Go packages found."
            exit 1
          fi
          go test -race -count=1 $PKGS

      - name: Build backend binary
        run: |
          mkdir -p dist
          go build -o dist/gravital-server ./server/cmd

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravital-server-ci
          path: dist/gravital-server
          if-no-files-found: error

  cd:
    name: CD (release artifact + optional deploy hook)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build production binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/gravital-server ./server/cmd

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravital-server-release-${{ github.sha }}
          path: dist/gravital-server
          if-no-files-found: error


